# 个人站点配置：主题从 sasaOrange-blog-hugo 以 submodule 的方式挂在 themes/ruri。
# 主题本身不保存任何个人设置，这个仓库才是「我的博客」的全部内容。

# 正式网址，末尾必须带 /。改成自定义域名时只改这一行。
baseURL = "https://sasaorange-blog-hugo-personalsite.pages.dev/"
# 站点标题。 / Site title.
title = "sasaOrange"
# 主题目录名；对应 .gitmodules 里 -> themes/ruri 的 submodule。
theme = "ruri"
# 默认语言。站点以简体中文为主。
defaultContentLanguage = "zh-cn"
# 使用语言子目录：/zh-cn/、/en/ 等。关掉会改变所有 URL 并影响已有链接。
defaultContentLanguageInSubdir = true
# 站点根路径直接跳到默认语言的首页，避免用户（和爬虫）落到 404。
defaultContentLanguageInSubdirRedirect = true
# RSS 版权后备文本；RSS license_type 优先。
copyright = "© sasaOrange"
# 无时区日期的默认时区。
timeZone = "Asia/Shanghai"
# 不发布草稿、未来或过期文章；到期隐藏需要重新构建部署。
buildDrafts = false
buildFuture = false
buildExpired = false
# 自动摘要长度；卡片额外截断至 110 字符。
summaryLength = 70

[languages.zh-cn]
label = "简体中文"
weight = 1
hasCJKLanguage = true
[languages.zh-tw]
label = "繁體中文"
weight = 2
hasCJKLanguage = true
[languages.en]
label = "English"
weight = 3
hasCJKLanguage = false
[languages.ja]
label = "日本語"
weight = 4
hasCJKLanguage = true

[markup.tableOfContents]
startLevel = 2
endLevel = 6
ordered = false

[outputs]
home = ["HTML", "RSS"]
[markup.highlight]
# 保持 false，让 CSS 适配深浅色代码块。
noClasses = false
guessSyntax = true

# 保留分类/标签名称，主题直接读取这两个 taxonomy。
[taxonomies]
category = "categories"
tag = "tags"
[markup.goldmark.renderer]
unsafe = false
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)'], ['$', '$']]

# 文章级配置写在 Markdown front matter，不是本文件：
# title/description、date/lastmod/expiryDate、draft、weight、categories/tags、
# cover、comments/toc/copyright/sponsor、sidebar、contentWidth、compact、
# math、mermaid。归档用 content/archives/_index.<语言>.md。
